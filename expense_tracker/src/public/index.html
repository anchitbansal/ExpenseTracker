<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal & Household Expense Tracking Dashboard" />
  <title>Expenses Tracker</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/loginStyle.css" />

</head>
<body>

  <!-- ================= AUTH CONTAINER ================= -->
  <div id="authContainer" class="auth-container">
    <!-- Login / Signup views dynamically injected here -->
  </div>

  <!-- ================= DASHBOARD CONTAINER ================= -->
  <div id="dashboard" class="dashboard hidden">
    
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"></path>
            <path d="M3 10h18"></path>
            <path d="M16 19l2-2 3 3"></path>
          </svg>
        </span> 
        <span class="brand-title">Expenses Tracker</span>
      </div>

      <nav class="sidebar" aria-label="Main Navigation">
        <div class="nav-item active" data-tab="dashboard" role="button" tabindex="0">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </span>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-tab="expenses" role="button" tabindex="0">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          </span>
          <span>Expenses</span>
        </div>
        <div class="nav-item" data-tab="category" role="button" tabindex="0">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
          </span>
          <span>Category</span>
        </div>
        <div class="nav-item" data-tab="profile" role="button" tabindex="0">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </span>
          <span>Profile</span>
        </div>
        <div class="nav-item" data-tab="members" role="button" tabindex="0">
          <span class="icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path><path d="M21 21v-2a4 4 0 0 0-3-3.87"></path><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path></svg>
          </span>
          <span>Members</span>
        </div>
      </nav>

      <div class="user-profile-badge">
        <!-- Theme Toggle Button -->
        <button id="themeToggleBtn" class="icon-theme-btn" title="Toggle Theme" aria-label="Toggle Dark and Light Mode">
          <!-- Sun Icon (for Dark Mode) -->
          <svg class="sun-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon Icon (for Light Mode) -->
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Logout Button -->
        <button id="logoutBtn" class="icon-logout-btn" title="Logout" aria-label="Logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <main class="content-area" id="mainContent"></main>
      <footer class="app-footer">
        <p>&copy; Developed by Ankur Chauhan. All rights reserved.</p>
      </footer>
    </div>
  </div>

  <!-- ================= GLOBAL MODAL ================= -->
  <div id="globalModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/views/login.js"></script>
  <script src="assets/js/views/signup.js"></script>
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/expenses.js"></script>
  <script src="assets/js/views/categories.js"></script>
  <script src="assets/js/views/profile.js"></script>
  <script src="assets/js/views/members.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
